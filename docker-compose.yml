services:
  magshorts:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      # Optional defaults; can also be set in the app's Settings dialog.
      - MARRETA_URL=${MARRETA_URL:-}
      # Digest schedule; unset TZ means UTC, so set DIGEST_TZ.
      - DIGEST_DAILY_AT=${DIGEST_DAILY_AT:-}
      - DIGEST_WEEKLY_AT=${DIGEST_WEEKLY_AT:-}
      - DIGEST_TZ=${DIGEST_TZ:-}
      # Digest annotations. Empty = extractive summaries, no model involved.
      # Ollama runs on the host, not in this stack: from a container it is
      # http://host.docker.internal:11434/v1 (or the LAN address on Linux).
      - LLM_PROVIDERS=${LLM_PROVIDERS:-}
      - LLM_OLLAMA_URL=${LLM_OLLAMA_URL:-}
      - LLM_OLLAMA_MODEL=${LLM_OLLAMA_MODEL:-}
      - LLM_OLLAMA_TIMEOUT_MS=${LLM_OLLAMA_TIMEOUT_MS:-}
      - LLM_GROQ_KEY=${LLM_GROQ_KEY:-}
      # Only provider calls go through this, and never one on localhost/LAN.
      - LLM_PROXY_URL=${LLM_PROXY_URL:-}
      # Ranking gets its own model so it doesn't share the annotations' budget.
      - LLM_RANK_PROVIDERS=${LLM_RANK_PROVIDERS:-}
      - DIGEST_RERANK=${DIGEST_RERANK:-}
      # Public URL for deep links in digest emails (e.g. https://magshorts.example.com)
      - APP_URL=${APP_URL:-}
      # Weekly digest email delivery (Gmail App Password or SMTP)
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_FROM=${SMTP_FROM:-}
    restart: unless-stopped
