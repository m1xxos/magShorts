name: Build & push image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/magshorts
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The home server is x86_64; native deps (better-sqlite3, sharp,
          # onnxruntime) make emulated arm64 builds painfully slow.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select image tag for scan
        id: image
        run: |
          PRIMARY_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT

      - name: Run Trivy container scanner (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: 'json'
          output: 'trivy-container-results.json'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          scanners: 'vuln'
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy container scanner (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          scanners: 'vuln'
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-container-results.sarif') != ''
        with:
          sarif_file: trivy-container-results.sarif
          category: container-image

      - name: Generate Vulnerability Summary & HTML Report
        if: always() && hashFiles('trivy-container-results.json') != ''
        run: |
          node scripts/generate-vulnerability-report.mjs \
            --input trivy-container-results.json \
            --title "Docker Container Vulnerability Scan" \
            --html container-vulnerability-report.html \
            --summary >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML Vulnerability Report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('container-vulnerability-report.html') != ''
        with:
          name: container-vulnerability-report
          path: container-vulnerability-report.html
          retention-days: 30
